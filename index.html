<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Super TGDQ Bros - O Desafio dos Dados</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    /* Barra Superior HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
      border-bottom: 3px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 15px;
      z-index: 10;
      font-family: 'Press Start 2P', monospace;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .hud-label {
      color: #94a3b8;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .hud-value {
      color: #fbbf24;
      font-size: 13px;
      text-shadow: 2px 2px 0px #000;
    }

    /* Área do Canvas */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin-top: 55px;
    }

    canvas {
      border: 4px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
      background: #38bdf8;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Controles Táteis para Telemóvel */
    #mobile-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .control-btn-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .btn-touch {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border: 3px solid #60a5fa;
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #1e3a8a, 0 8px 15px rgba(0,0,0,0.5);
      transition: transform 0.05s;
      cursor: pointer;
    }

    .btn-touch:active, .btn-touch.active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e3a8a, 0 4px 10px rgba(0,0,0,0.5);
      background: linear-gradient(145deg, #2563eb, #1e40af);
    }

    .btn-jump {
      width: 75px;
      height: 75px;
      background: linear-gradient(145deg, #ef4444, #dc2626);
      border-color: #f87171;
      box-shadow: 0 6px 0 #991b1b, 0 8px 15px rgba(239, 68, 68, 0.4);
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
    }

    .btn-jump:active, .btn-jump.active {
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      box-shadow: 0 2px 0 #991b1b;
    }

    /* Modais */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 3px solid #fbbf24;
      border-radius: 16px;
      padding: 24px;
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.3);
    }

    .modal-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #fbbf24;
      line-height: 1.6;
      margin-bottom: 15px;
      border-bottom: 2px dashed #334155;
      padding-bottom: 10px;
      text-shadow: 2px 2px 0 #000;
    }

    .modal-question {
      font-size: 17px;
      line-height: 1.5;
      color: #f8fafc;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 10px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #475569;
      border-color: #38bdf8;
      transform: translateX(4px);
    }

    .feedback-card {
      text-align: center;
      max-width: 520px;
    }

    .feedback-icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .feedback-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .feedback-text {
      font-size: 16px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .report-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      padding: 25px;
      font-family: Arial, sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .report-header {
      text-align: center;
      border-bottom: 3px double #2563eb;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .report-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e3a8a;
      margin: 0;
    }

    .report-subtitle {
      font-size: 13px;
      color: #475569;
      margin-top: 5px;
      font-weight: 600;
    }

    .report-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
      background: #f1f5f9;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }

    .report-stat-item {
      font-size: 14px;
    }

    .report-stat-item strong {
      color: #1e40af;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .report-table th, .report
