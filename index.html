<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Super TGDQ Bros - O Desafio dos Dados</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    /* Top Arcade HUD Bar */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
      border-bottom: 3px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 15px;
      z-index: 10;
      font-family: 'Press Start 2P', monospace;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .hud-label {
      color: #94a3b8;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .hud-value {
      color: #fbbf24;
      font-size: 13px;
      text-shadow: 2px 2px 0px #000;
    }

    /* Canvas Wrapper */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    canvas {
      border: 4px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
      background: #5c94fc;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

      bottom: 20px;
      left: 0;
      width: 10
